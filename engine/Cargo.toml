[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/conversation",
    "crates/desktop-runtime",
    "crates/protoc-resolver",
    "crates/rust-scrapling-runtime",
    "crates/storage",
    "crates/skill",
]
exclude = ["vendor/rust-scrapling"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EncoreHub Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1"
thiserror = "2"
# Database
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "=0.1.7-alpha.2"
# Embedded vector database and its Arrow data contract.
lancedb = { version = "0.33", default-features = false }
arrow-array = "58"
arrow-schema = "58"
# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Async streaming
futures = "0.3"
# UUID
uuid = { version = "1", features = ["v4", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Text processing
regex = "1"
quick-xml = "0.39"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# Shared HTTP transfer core for search, direct page reads, and the future
# stateful browser boundary. It is linked into the Engine Runtime module.
curl = "0.4"
libloading = "0.8"
url = "2"
# WASM runtime for plugins
# wasmtime = "25"

[profile.release]
opt-level = 3
# LTO makes the modular desktop Runtime spend minutes in a single final rustc
# step after every Engine change. The DLL is an independent optimization and
# upgrade boundary, so routine release builds keep parallel code generation
# without repeating whole-graph link-time optimization.
lto = false
codegen-units = 16
strip = true

# Root package — engine + MCP server binaries
[package]
name = "encorehub-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# `standalone` compiles the binary entrypoints (encorehub-engine + encorehub-mcp).
# With it off, this crate is library-only and consumed by the versioned Engine
# Runtime dynamic library. The feature adds no extra
# dependencies; axum/tokio are workspace dependencies used in both modes.
standalone = []

# `[[bin]]` targets can't be `#[cfg]`-gated directly, so we gate them with
# `required-features`: a plain `cargo build` (no feature) skips them and produces
# only the library; `--features standalone` builds both binaries.
[[bin]]
name = "encorehub-engine"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "encorehub-mcp"
path = "src/mcp_server.rs"
required-features = ["standalone"]

[dependencies]
encorehub-core = { path = "crates/core" }
encorehub-conversation = { path = "crates/conversation" }
encorehub-storage = { path = "crates/storage" }
encorehub-skill = { path = "crates/skill" }

# Secret encryption (Sprint 6): Argon2id password derivation + AES-256-GCM.
# Master key/password never persisted — only ciphertext, salt, verifier.
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
regex.workspace = true
quick-xml.workspace = true
zip.workspace = true
curl.workspace = true
libloading.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
rusqlite.workspace = true
tower.workspace = true
