[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EncoreHub Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1"
thiserror = "2"
# Database
rusqlite = { version = "0.32", features = ["bundled"] }
# Vector DB — lancedb Rust SDK (placeholder until available)
# lancedb = "0.17"
# HTTP server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# gRPC
tonic = "0.12"
prost = "0.13"
# Async streaming
async-stream = "0.3"
futures = "0.3"
# UUID
uuid = { version = "1", features = ["v4", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Config
toml = "0.8"
dotenvy = "0.15"
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
# Text processing
unicode-segmentation = "1"
regex = "1"
# WASM runtime for plugins
# wasmtime = "25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Root package — the engine binary
[package]
name = "encorehub-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encorehub-core = { path = "crates/core" }
encorehub-storage = { path = "crates/storage" }

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
