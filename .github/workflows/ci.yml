name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Frontend =====
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      - name: Build Linux gateway sidecar for Tauri
        working-directory: gateway
        run: |
          mkdir -p ../frontend/src-tauri/binaries
          go build -trimpath -o ../frontend/src-tauri/binaries/gateway-x86_64-unknown-linux-gnu ./cmd/gateway
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Upload frontend assets for desktop jobs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
      - name: Check Tauri desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: List Tauri desktop tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --list
      - name: Test Tauri desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ===== Gateway (Go) =====
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/gateway ./cmd/gateway

  # ===== Engine (Rust) =====
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - name: Lint Engine workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint standalone Engine targets
        run: cargo clippy -p encorehub-engine --all-targets --features standalone -- -D warnings
      - name: List Engine workspace tests
        run: cargo test --workspace -- --list
      - name: Test Engine workspace
        run: cargo test --workspace
      - name: Test standalone Engine targets
        run: cargo test -p encorehub-engine --all-targets --features standalone
      - run: cargo build --release -p encorehub-engine --bins --features standalone

  # ===== Desktop (Windows-only process/sidecar paths) =====
  desktop-windows:
    needs: frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Download validated frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Verify frontend assets required by Tauri macros
        shell: pwsh
        run: |
          if (-not (Test-Path ../dist/index.html)) {
            throw "frontend/dist/index.html is required by tauri build.frontendDist"
          }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - name: Build Windows gateway sidecar for Tauri
        shell: pwsh
        working-directory: gateway
        run: |
          New-Item -ItemType Directory -Force ../frontend/src-tauri/binaries | Out-Null
          go build -trimpath -o ../frontend/src-tauri/binaries/gateway-x86_64-pc-windows-msvc.exe ./cmd/gateway
      - name: Check Windows desktop process integration
        run: cargo check
      - name: List Windows desktop tests
        run: cargo test -- --list
      - name: Test Windows desktop process integration
        run: cargo test

  # ===== Data Services (Python) =====
  data-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check src/ tests/
      - run: uv run --frozen mypy src/ tests/
      - run: uv run --frozen pytest

  # ===== Container contract + clean smoke =====
  containers:
    runs-on: ubuntu-latest
    env:
      ENCOREHUB_ENGINE_AUTH_TOKEN: ci-container-engine-token-32-bytes-minimum
      ENCOREHUB_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify workspace and container contracts
        run: node --test scripts/workspace-contract.test.mjs
      - name: Build clean Compose images
        run: docker compose build --no-cache
      - name: Start Compose stack
        run: docker compose up -d
      - name: Wait for Gateway readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Verify published surface
        run: |
          docker compose ps
          curl --fail http://127.0.0.1:8080/api/v1/health/ready
          if curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null; then
            echo "Engine must not be published to the host" >&2
            exit 1
          fi
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
