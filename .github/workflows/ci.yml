name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Documentation and workspace contracts =====
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links, OpenAPI, ADRs, and documented commands
        run: pnpm test:docs
      - name: Check workspace contracts
        run: node --test scripts/workspace-contract.test.mjs

  # ===== Frontend checks =====
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:bundle

  # ===== Gateway (Go) checks =====
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...

  # ===== Engine (Rust) checks =====
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
      - run: cargo fmt --all -- --check
      - name: Lint Engine workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint standalone Engine targets
        run: cargo clippy -p encorehub-engine --all-targets --features standalone -- -D warnings
      - name: List Engine workspace tests
        run: cargo test --workspace -- --list
      - name: Test Engine workspace
        run: cargo test --workspace
      - name: Test standalone Engine targets
        run: cargo test -p encorehub-engine --all-targets --features standalone
