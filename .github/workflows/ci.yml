name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Frontend =====
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      - name: Build Linux gateway sidecar for Tauri
        working-directory: gateway
        run: |
          mkdir -p ../frontend/src-tauri/binaries
          go build -trimpath -o ../frontend/src-tauri/binaries/gateway-x86_64-unknown-linux-gnu ./cmd/gateway
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Check Tauri desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: List Tauri desktop tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --list
      - name: Test Tauri desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ===== Gateway (Go) =====
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/gateway ./cmd/gateway

  # ===== Engine (Rust) =====
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - name: Lint Engine workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint standalone Engine targets
        run: cargo clippy -p encorehub-engine --all-targets --features standalone -- -D warnings
      - name: List Engine workspace tests
        run: cargo test --workspace -- --list
      - name: Test Engine workspace
        run: cargo test --workspace
      - name: Test standalone Engine targets
        run: cargo test -p encorehub-engine --all-targets --features standalone
      - run: cargo build --release -p encorehub-engine --bins --features standalone

  # ===== Desktop (Windows-only process/sidecar paths) =====
  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - name: Build Windows gateway sidecar for Tauri
        shell: pwsh
        working-directory: gateway
        run: |
          New-Item -ItemType Directory -Force ../frontend/src-tauri/binaries | Out-Null
          go build -trimpath -o ../frontend/src-tauri/binaries/gateway-x86_64-pc-windows-msvc.exe ./cmd/gateway
      - name: Check Windows desktop process integration
        run: cargo check
      - name: List Windows desktop tests
        run: cargo test -- --list
      - name: Test Windows desktop process integration
        run: cargo test

  # ===== Data Services (Python) =====
  data-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check src/ tests/
      - run: uv run --frozen mypy src/ tests/
      - run: uv run --frozen pytest
