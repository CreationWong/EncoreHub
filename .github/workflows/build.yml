# Builds cross-platform installers and publishes one versioned GitHub Release.
name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Installer platform
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - Windows
          - macOS
          - Linux
      prerelease:
        description: Publish as a Pre-release instead of a formal release
        required: true
        default: true
        type: boolean
      force_publish:
        description: Update an existing tag or Release and replace matching assets
        required: true
        default: false
        type: boolean
      title_suffix:
        description: Optional text appended to the Release title
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare changelog, contributors, and build matrix
        id: metadata
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TITLE_SUFFIX: ${{ inputs.title_suffix }}
        run: |
          node scripts/release-metadata.mjs prepare \
            --platform "$RELEASE_PLATFORM" \
            --prerelease "$RELEASE_PRERELEASE" \
            --title-suffix "$RELEASE_TITLE_SUFFIX" \
            --output release-notes.md \
            --github-output "$GITHUB_OUTPUT"
      - name: Reject conflicting Release or tag unless forced
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          release_exists=false
          tag_exists=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            tag_exists=true
          fi
          if { [ "$release_exists" = true ] || [ "$tag_exists" = true ]; } && [ "$FORCE_PUBLISH" != true ]; then
            echo "Release or tag $TAG already exists. Enable force_publish to update it." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build-installers:
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: arduino/setup-protoc@v3
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libcurl4-openssl-dev \
            patchelf
      - name: Configure Windows vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_EXE=$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        run: |
          brew install curl pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix curl)/bin:$PATH" >> "$GITHUB_ENV"
      - name: Build Windows installers through the repository script
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -Tauri
      - name: Build Unix installers through the repository script
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh --tauri
      - name: Collect Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $assets = Get-ChildItem frontend/src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not $assets) { throw 'No Windows installer was produced' }
          $assets | Copy-Item -Destination release-assets
      - name: Collect macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          find frontend/src-tauri/target/release/bundle -type f -name '*.dmg' -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"
      - name: Collect Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          find frontend/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$FORCE_PUBLISH" != true ]; then
              echo "Release $TAG appeared after preflight; refusing to overwrite it." >&2
              exit 1
            fi
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file release-metadata/release-notes.md \
              --draft=false \
              --prerelease="$PRERELEASE"
          else
            release_args=(
              "$TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$TITLE"
              --notes-file release-metadata/release-notes.md
            )
            if [ "$PRERELEASE" = true ]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
          if [ "$FORCE_PUBLISH" = true ]; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          fi
