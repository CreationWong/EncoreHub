services:
  # ===== API Gateway (Go) =====
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "${ENCOREHUB_GATEWAY_HOST:-127.0.0.1}:8080:8080"
    environment:
      - GIN_MODE=release
      - LISTEN_ADDR=:8080
      - ENGINE_URL=http://engine:3000
      - ENCOREHUB_ENGINE_AUTH_TOKEN=${ENCOREHUB_ENGINE_AUTH_TOKEN:?ENCOREHUB_ENGINE_AUTH_TOKEN is required}
      - ENCOREHUB_AUTH_TOKEN=${ENCOREHUB_AUTH_TOKEN:-}
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===== Core Engine (Rust) =====
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    expose:
      - "3000"
    environment:
      - RUST_LOG=info
      - ENGINE_BIND=0.0.0.0:3000
      - ENCOREHUB_ENGINE_AUTH_TOKEN=${ENCOREHUB_ENGINE_AUTH_TOKEN:?ENCOREHUB_ENGINE_AUTH_TOKEN is required}
      - ENGINE_DB=/data/encorehub.db
    volumes:
      - engine_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: Bearer $${ENCOREHUB_ENGINE_AUTH_TOKEN}\" http://127.0.0.1:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  engine_data:
