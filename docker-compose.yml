version: "3.9"

# NOTE: Gateway <-> Engine currently communicates over HTTP/JSON.
# gRPC is planned (see docs/IMPROVEMENT_REPORT.md) but not yet wired up;
# 50051/9090 ports are intentionally not exposed until tonic is enabled.

services:
  # ===== API Gateway (Go) =====
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=debug
      - LISTEN_ADDR=:8080
      - ENGINE_URL=http://engine:3000
      - DATA_SERVICE_URL=http://data-services:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./gateway:/app
    depends_on:
      - engine
      - redis
    restart: unless-stopped

  # ===== Core Engine (Rust) =====
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - ENGINE_BIND=0.0.0.0:3000
      - DATABASE_URL=sqlite:///data/encorehub.db
      - LANCEDB_PATH=/data/lancedb
    volumes:
      - engine_data:/data
      - ./engine:/app
    restart: unless-stopped

  # ===== Data Services (Python) =====
  data-services:
    build:
      context: ./data-services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENGINE_URL=http://engine:3000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data-services:/app
    depends_on:
      - engine
      - redis
    restart: unless-stopped

  # ===== Redis (cache + message queue) =====
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  engine_data:
  redis_data:
