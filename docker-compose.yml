version: "3.9"

# NOTE: Gateway <-> Engine currently communicates over HTTP/JSON.
# gRPC is planned (see docs/IMPROVEMENT_REPORT.md) but not yet wired up;
# 50051/9090 ports are intentionally not exposed until tonic is enabled.

services:
  # ===== API Gateway (Go) =====
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "${ENCOREHUB_GATEWAY_HOST:-127.0.0.1}:8080:8080"
    environment:
      - GIN_MODE=debug
      - LISTEN_ADDR=:8080
      - ENGINE_URL=http://engine:3000
      - ENCOREHUB_ENGINE_AUTH_TOKEN=${ENCOREHUB_ENGINE_AUTH_TOKEN:?ENCOREHUB_ENGINE_AUTH_TOKEN is required}
      - ENCOREHUB_AUTH_TOKEN=${ENCOREHUB_AUTH_TOKEN:-}
      - DATA_SERVICE_URL=http://data-services:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./gateway:/app
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===== Core Engine (Rust) =====
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - RUST_LOG=info
      - ENGINE_BIND=0.0.0.0:3000
      - ENCOREHUB_ENGINE_AUTH_TOKEN=${ENCOREHUB_ENGINE_AUTH_TOKEN:?ENCOREHUB_ENGINE_AUTH_TOKEN is required}
      - DATABASE_URL=sqlite:///data/encorehub.db
      - LANCEDB_PATH=/data/lancedb
    volumes:
      - engine_data:/data
      - ./engine:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: Bearer $${ENCOREHUB_ENGINE_AUTH_TOKEN}\" http://127.0.0.1:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===== Data Services (Python) =====
  data-services:
    build:
      context: ./data-services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENGINE_URL=http://engine:3000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data-services:/app
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ===== Redis (cache + message queue) =====
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  engine_data:
  redis_data:
