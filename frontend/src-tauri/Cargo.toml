[package]
name = "encorehub-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
# `devtools` keeps the webview inspector available in release builds too, so
# the Developer panel's "Open DevTools" button works in packaged installs.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
chrono = "0.4"
# Engine runs in-process (no external sidecar exe). `default-features = false`
# keeps the `standalone` feature off so the engine's binary entrypoints aren't
# pulled in — we only use its library `serve()` API.
encorehub-engine = { path = "../../engine", default-features = false }
# Bridge the in-process engine's tracing events into the developer-panel log
# buffer (replacing the old stdout/stderr pipe drain).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
