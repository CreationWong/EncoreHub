[package]
name = "encorehub-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
# `devtools` keeps the webview inspector available in release builds too, so
# the Developer panel's "Open DevTools" button works in packaged installs.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
chrono = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "=0.1.7-alpha.2"
tokio = { version = "1", features = ["sync", "time"] }
libloading = "0.7.4"
# Desktop tracing remains in the executable. Engine tracing crosses the
# versioned dynamic-library ABI through a callback.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
