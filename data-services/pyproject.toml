[project]
name = "encorehub-data-services"
version = "0.1.0"
description = "EncoreHub AI data pipeline - document ingestion, embedding, RAG, web scraping"
requires-python = ">=3.12"
dependencies = [
    # Web framework (internal API)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Document parsing
    "pymupdf>=1.25",         # PDF
    "python-docx>=1.1",      # Word
    "markdown-it-py>=3.0",   # Markdown
    # Text processing
    "tiktoken>=0.8",
    "langchain-text-splitters>=0.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "trafilatura>=1.12",     # Web content extraction
    # Embedding / AI
    "openai>=1.55",
    "sentence-transformers>=3.3",
    "huggingface-hub>=0.26",
    # RAG
    "llama-index-core>=0.12",
    "llama-index-embeddings-openai>=0.3",
    "llama-index-embeddings-huggingface>=0.4",
    # HTTP / scraping
    "httpx>=0.28",
    "aiohttp>=3.11",
    # Data processing
    "numpy>=2.1",
    "pandas>=2.2",
    # Async task queue
    "celery>=5.4",
    "redis>=5.2",
    # gRPC
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
