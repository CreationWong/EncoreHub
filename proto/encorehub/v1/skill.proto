syntax = "proto3";

package encorehub.v1;

// ===== Skill Management Service =====

service SkillService {
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc InstallSkill(InstallSkillRequest) returns (Skill);
  rpc UninstallSkill(UninstallSkillRequest) returns (UninstallSkillResponse);
  rpc ToggleSkill(ToggleSkillRequest) returns (Skill);
  rpc InvokeSkill(InvokeSkillRequest) returns (InvokeSkillResponse);
}

message Skill {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  string author = 5;
  bool enabled = 6;
  bool builtin = 7;
  repeated string triggers = 8;
  repeated SkillTool tools = 9;
  string install_path = 10;
}

message SkillTool {
  string name = 1;
  string description = 2;
  string parameters_schema = 3;  // JSON Schema string
}

// ===== Requests =====

message ListSkillsRequest {
  bool enabled_only = 1;
}

message ListSkillsResponse {
  repeated Skill skills = 1;
}

message InstallSkillRequest {
  string source = 1;  // git URL or local path
}

message UninstallSkillRequest {
  string id = 1;
}

message UninstallSkillResponse {
  bool success = 1;
}

message ToggleSkillRequest {
  string id = 1;
  bool enabled = 2;
}

message InvokeSkillRequest {
  string skill_id = 1;
  string tool_name = 2;
  string arguments = 3;  // JSON string
}

message InvokeSkillResponse {
  string result = 1;  // JSON string
  bool success = 2;
  string error = 3;
}
