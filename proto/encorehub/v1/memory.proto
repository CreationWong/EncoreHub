syntax = "proto3";

package encorehub.v1;

import "encorehub/v1/common.proto";

// ===== Memory Service =====

service MemoryService {
  rpc StoreMemory(StoreMemoryRequest) returns (Memory);
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  rpc ConsolidateMemories(ConsolidateRequest) returns (ConsolidateResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc ListMemoryGroups(ListMemoryGroupsRequest) returns (ListMemoryGroupsResponse);
  rpc CreateMemoryGroup(CreateMemoryGroupRequest) returns (MemoryGroup);
  rpc UpdateCharacterMemorySettings(UpdateCharacterMemorySettingsRequest) returns (CharacterMemorySettings);
}

message Memory {
  string id = 1;
  MemoryScope scope = 2;
  MemoryType type = 3;
  string conversation_id = 4;  // empty for global memories
  string content = 5;
  float importance = 6;  // 0.0 - 1.0
  Timestamp created_at = 7;
  Timestamp last_accessed = 8;
  string group_id = 9;
  string source_character_id = 10;
  MemoryState state = 11;
  MemoryKind kind = 12;
  string canonical_key = 13;
  string reason = 14;
  string source_turn_id = 15;
  string created_by_model = 16;
  float confidence = 17;
}

enum MemoryState {
  MEMORY_STATE_UNSPECIFIED = 0;
  MEMORY_STATE_TRANSIENT = 1;
  MEMORY_STATE_SHORT_TERM = 2;
  MEMORY_STATE_LONG_TERM = 3;
  MEMORY_STATE_PERMANENT_CANDIDATE = 4;
  MEMORY_STATE_PERMANENT = 5;
  MEMORY_STATE_FORGOTTEN = 6;
}

enum MemoryKind {
  MEMORY_KIND_UNSPECIFIED = 0;
  MEMORY_KIND_FACT = 1;
  MEMORY_KIND_PREFERENCE = 2;
  MEMORY_KIND_EVENT = 3;
  MEMORY_KIND_INSTRUCTION = 4;
  MEMORY_KIND_SUMMARY = 5;
}

enum MemoryMode {
  MEMORY_MODE_UNSPECIFIED = 0;
  MEMORY_MODE_SIMPLE = 1;
  MEMORY_MODE_RAG = 2;
  MEMORY_MODE_RAG_ENHANCED = 3;
  MEMORY_MODE_REALISTIC = 4;
}

enum MemoryScope {
  MEMORY_SCOPE_UNSPECIFIED = 0;
  MEMORY_SCOPE_CONVERSATION = 1;
  MEMORY_SCOPE_GLOBAL = 2;
}

enum MemoryType {
  MEMORY_TYPE_UNSPECIFIED = 0;
  MEMORY_TYPE_WORKING = 1;
  MEMORY_TYPE_EPISODIC = 2;
  MEMORY_TYPE_SEMANTIC = 3;
  MEMORY_TYPE_PINNED = 4;
}

message StoreMemoryRequest {
  MemoryScope scope = 1;
  MemoryType type = 2;
  string conversation_id = 3;
  string content = 4;
  float importance = 5;
}

message SearchMemoriesRequest {
  string query = 1;
  MemoryScope scope = 2;  // optional filter
  int32 top_k = 3;
}

message SearchMemoriesResponse {
  repeated MemoryResult results = 1;
}

message MemoryResult {
  Memory memory = 1;
  float score = 2;  // relevance score
}

message ConsolidateRequest {
  string conversation_id = 1;
}

message ConsolidateResponse {
  int32 memories_created = 1;
  int32 memories_updated = 2;
  int32 memories_merged = 3;
}

message DeleteMemoryRequest {
  string id = 1;
}

message DeleteMemoryResponse {
  bool success = 1;
}

message MemoryGroup {
  string id = 1;
  string profile_id = 2;
  string name = 3;
  string group_type = 4;
  string owner_character_id = 5;
  Timestamp archived_at = 6;
  Timestamp created_at = 7;
  Timestamp updated_at = 8;
}

message ListMemoryGroupsRequest {
  bool include_archived = 1;
}

message ListMemoryGroupsResponse {
  repeated MemoryGroup groups = 1;
}

message CreateMemoryGroupRequest {
  string name = 1;
}

message MemoryGroupInheritance {
  string character_id = 1;
  string group_id = 2;
  string access_mode = 3;
  int64 priority = 4;
}

message CharacterMemorySettings {
  string character_id = 1;
  MemoryMode default_mode = 2;
  bool realistic_enabled = 3;
  repeated MemoryGroupInheritance inherited_groups = 4;
  Timestamp updated_at = 5;
}

message UpdateCharacterMemorySettingsRequest {
  string character_id = 1;
  MemoryMode default_mode = 2;
  bool realistic_enabled = 3;
  repeated MemoryGroupInheritance inherited_groups = 4;
}
